[package]
name = "nonebot-plugin-kuwo-rust"
version = "0.3.0-alpha2"
edition = "2021"
publish = false

[lib]
name = "_qmc_rs"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py310"] }
resvg = { version = "0.48", default-features = false, features = [
    "raster-images",
    "system-fonts",
    "text",
] }
